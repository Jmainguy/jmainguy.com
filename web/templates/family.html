{{define "content"}}
<section class="page-mast family-mast">
  <p class="eyebrow">The Mainguy family</p>
  <h1 class="page-title">Family <span class="text-moss dark:text-acid">tree.</span></h1>
  <p class="page-deck">Start with Holden and Hazel. Select any connected person to move through the family.</p>
</section>

<section class="shell mt-10" data-family-explorer>
  <div class="family-stage">
    <div class="family-parents" data-family-parents></div>
    <div class="family-parent-connector" aria-hidden="true"></div>

    <article class="family-focus" data-family-focus></article>

    <div class="family-connector" aria-hidden="true"></div>
    <div class="family-children" data-family-children></div>
  </div>
  <p class="family-credit">Thank you to <a href="http://mainguy.ca/">Mainguy.ca</a> for researching and documenting this family tree.</p>
</section>
{{end}}
