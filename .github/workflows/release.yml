name: Golang Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to publish with GoReleaser (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: Jmainguy/golang-workflows/.github/workflows/golang-release.yml@v1
    secrets:
      token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      docker_password: ${{ secrets.DOCKER_PASSWORD }}
    with:
      docker_url: zot.soh.re
      tag: ${{ inputs.tag || '' }}

  sign:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - run: git fetch --force --tags

      - uses: docker/login-action@v4
        with:
          registry: zot.soh.re
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: imjasonh/setup-crane@v0.4

      - name: Resolve released image
        id: image
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          tag="${REQUESTED_TAG:-$(git tag --points-at HEAD --list 'v*' | sort -V | tail -1)}"
          if [ -z "$tag" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          image="zot.soh.re/jmainguy/jmainguy.com:${tag}"
          digest="$(crane digest "$image")"
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "artifact=zot.soh.re/jmainguy/jmainguy.com@${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign and verify immutable image
        if: steps.image.outputs.released == 'true'
        uses: Jmainguy/notation-action@v1
        with:
          version: 1.3.2
          artifact: ${{ steps.image.outputs.artifact }}
          key-name: jon-soh-re
          private-key: ${{ secrets.NOTATION_PRIVATE_KEY }}
          certificate-chain: ${{ secrets.NOTATION_CERTIFICATE_CHAIN }}
          ca-certificate: ${{ secrets.NOTATION_CA_CERTIFICATE }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
