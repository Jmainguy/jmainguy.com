name: Golang Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to publish with GoReleaser (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: Jmainguy/golang-workflows/.github/workflows/golang-release.yml@v1
    secrets:
      token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      docker_password: ${{ secrets.DOCKER_PASSWORD }}
      notation_private_key: ${{ secrets.NOTATION_PRIVATE_KEY }}
      notation_certificate_chain: ${{ secrets.NOTATION_CERTIFICATE_CHAIN }}
      notation_ca_certificate: ${{ secrets.NOTATION_CA_CERTIFICATE }}
    with:
      docker_url: zot.soh.re
      registry_namespace: jmainguy
      image_name: jmainguy.com
      notation_key_name: jon-soh-re
      tag: ${{ inputs.tag || '' }}
